[package]
name = "hlm-kernels"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASM compute kernels for LiquidityMapperFast: heatmap rasterisation and level grouping."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
