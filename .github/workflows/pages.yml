# Publishes the page to GitHub Pages. The page needs no server: it reads the exchanges' public feeds from the visitor's browser.
# Nothing here runs until the repository is pushed to GitHub and Pages is set to "GitHub Actions" in the repository settings.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typechecks the three projects, then builds the page with relative URLs (it works under /<repository>/) and no source maps.
      - run: npm run build:site
        env:
          HLM_SOURCEMAP: 'off'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
