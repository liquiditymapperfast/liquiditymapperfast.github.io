# Publishes the page to Cloudflare Pages (liquiditymapper.com) and the old address's page (moved-site/) to GitHub Pages
# (liquiditymapperfast.github.io), which sends visitors on to the new address with what their browser saved there. The page needs no
# server: it reads the exchanges' public feeds from the visitor's browser.
name: Pages

on:
  push:
    branches: [master]
  # Once a day the coin list is rebuilt from the markets' lists and the site published again with it (GitHub stops a schedule after
  # 60 days without a push to the repository; a push or a manual run starts it again).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typechecks the three projects, then builds the page with relative URLs (it works under /<repository>/) and no source maps.
      - run: npm run build:site
        env:
          HLM_SOURCEMAP: 'off'
      # The coin list (src/shared/coins.ts): a market whose list cannot be read from here (some exchanges refuse US addresses, where the
      # runners are) keeps its listings from the list the site has now; the copy in the repository stands in if that cannot be read.
      # A failure here never stops the deploy: the copy built into dist stays.
      # The list in use is read from liquiditymapper.com once it serves the site, and from the github.io address until then.
      - run: |
          npm run build:tools
          previous=https://liquiditymapper.com/coins.json
          curl -sf -m 20 "$previous" | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))' || previous=https://liquiditymapperfast.github.io/coins.json
          node build/tools/scripts/coins.mjs --previous "$previous" --fallback src/app/public/coins.json --out dist/coins.json
        continue-on-error: true
      # The site, for Cloudflare.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: site
          path: dist
      # The old address's page, for GitHub Pages (since 2026-11-14 the github.io address only sends visitors on: docs/deployment.md).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moved-site

  # GitHub Pages serves the old address's page only from the account it started on (liquiditymapperfast.github.io); a copy of the
  # repository anywhere else publishes to Cloudflare alone.
  deploy:
    needs: build
    if: github.repository_owner == 'liquiditymapperfast'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same files on Cloudflare Pages (project liquiditymapper, served at liquiditymapper.com). It runs only where the repository has
  # the CLOUDFLARE_API_TOKEN secret (a token allowed "Cloudflare Pages: Edit" on one account) and the CLOUDFLARE_ACCOUNT_ID secret: such a
  # token cannot read the account memberships wrangler would otherwise ask for. The first run creates the project with master as its
  # production branch, so every deploy from here lands in production.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Cloudflare Pages skipped (needs both secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID)"
      - if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
      - if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir site && tar -xf artifact.tar -C site
          projects=$(npx --yes wrangler@4.14.0 pages project list)
          if ! grep -qE '(^|[^a-z0-9-])liquiditymapper([^a-z0-9-]|$)' <<<"$projects"; then
            npx --yes wrangler@4.14.0 pages project create liquiditymapper --production-branch master
          fi
          npx --yes wrangler@4.14.0 pages deploy site --project-name liquiditymapper --branch master --commit-hash "$GITHUB_SHA" --commit-dirty=true
